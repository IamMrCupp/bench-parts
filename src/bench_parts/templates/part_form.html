{% extends "base.html" %}

{% block title %}Add part — bench-parts{% endblock %}
{% block heading %}Add a part{% endblock %}

{% block content %}
  {% if error %}
    <p class="error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="/parts">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    {% include "_part_fields.html" %}

    <fieldset>
      <legend>Opening stock</legend>

      <label for="quantity_on_hand">Opening quantity
        <span class="hint">How many you have right now. This is recorded as the first stock movement; later changes go through restock / use / correct.</span>
      </label>
      <input id="quantity_on_hand" name="quantity_on_hand" value="{{ values.quantity_on_hand }}"
             inputmode="numeric" pattern="[0-9]*" placeholder="0" />
    </fieldset>

    <button type="submit">Add part</button>
  </form>
{% endblock %}
