[project]
name = "bench-parts"
dynamic = ["version"]
description = "Self-hosted parts inventory for a board-repair bench — a tablet-friendly app plus a REST API benchhud and other LAN clients consume."
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Small-Business-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Cupp" }]
keywords = ["inventory", "parts", "board-repair", "bench", "self-hosted"]

# This package is not open source. The classifier makes PyPI refuse an upload
# outright — belt and braces against a stray `uv publish`.
classifiers = ["Private :: Do Not Upload"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/IamMrCupp/bench-parts"
Issues = "https://github.com/IamMrCupp/bench-parts/issues"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "httpx2>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/bench_parts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bench_parts"]

# Kept deliberately identical to benchhud-intake's config so the two repos lint
# the same way and muscle memory transfers between them.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
