[project]
name = "bench-parts"
dynamic = ["version"]
description = "Self-hosted parts inventory for a board-repair bench — a tablet-friendly app plus a REST API benchhud and other LAN clients consume."
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Small-Business-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Cupp" }]
keywords = ["inventory", "parts", "board-repair", "bench", "self-hosted"]

# This package is not open source. The classifier makes PyPI refuse an upload
# outright — belt and braces against a stray `uv publish`.
classifiers = ["Private :: Do Not Upload"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "segno>=1.6.6",
]

[project.optional-dependencies]
# The label bridge runs on the bench box, not in the server image — Pillow
# never enters the container. The NIIMBOT CLI itself (niimprintx etc.) is
# git-only and installed separately on the bench box; it is invoked as a
# subprocess, never imported, so it is deliberately NOT a dependency here.
label = ["pillow>=10.1"]
# The menu-bar / tray app. Essentials is QtCore, QtGui and QtWidgets only; the
# server (container, cluster, `serve`) never needs Qt.
tray = ["pyside6-essentials>=6.8"]

[project.scripts]
bench-parts = "bench_parts.cli:main"
bench-parts-label = "bench_parts.label_bridge:main"

[project.urls]
Homepage = "https://github.com/IamMrCupp/bench-parts"
Issues = "https://github.com/IamMrCupp/bench-parts/issues"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "httpx2>=2.7.0",
    # so the label-bridge tests run everywhere the suite does
    "pillow>=10.1",
    "pyside6-essentials>=6.8",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/bench_parts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bench_parts"]

# Kept deliberately identical to benchhud-intake's config so the two repos lint
# the same way and muscle memory transfers between them.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# The menu-bar / tray app (#86), packaged with Briefcase like benchhud. Name,
# version and dependencies come from [project]; this adds what a bundle needs.
[tool.briefcase]
project_name = "bench-parts"
bundle = "com.iammrcupp.benchhud"

[tool.briefcase.app.bench-parts]
formal_name = "bench parts"
description = "Bench parts inventory: a menu-bar app that runs the bench-parts server."
long_description = """bench parts keeps the bench's parts inventory: what's in which drawer,
what's running low, and what a job used. benchhud reads it over the same API
scripts can use. This app runs it from the menu bar (macOS) or system tray
(Windows): start, stop, share on the LAN, set the password and the API token."""
sources = ["src/bench_parts"]
requires = ["pyside6-essentials>=6.8"]
icon = "packaging/icons/parts"

[tool.briefcase.app.bench-parts.macOS]
# PySide6 6.8+ only ships macosx_13_0 wheels (as in benchhud); one arch per build.
universal_build = false
min_os_version = "13.0"
requires = ["std-nslog~=1.0.3"]
# A menu-bar app: no Dock icon, no main window.
info."LSUIElement" = true
