# TEMPLATE ONLY: never commit real values. Copy it, fill it in, apply it, delete it:
#
#   cp secret.example.yaml /tmp/parts-secret.yaml && $EDITOR /tmp/parts-secret.yaml
#   kubectl -n <namespace> apply -f /tmp/parts-secret.yaml && rm /tmp/parts-secret.yaml
#
# The password hash: run `bench-parts set-password` anywhere and copy the
# BENCH_PARTS_PASSWORD_HASH line from its settings.env (`bench-parts paths`), or
# `uv run python -m bench_parts.auth` in a checkout.
apiVersion: v1
kind: Secret
metadata:
  name: bench-parts-secrets
type: Opaque
stringData:
  # Required. The app won't start without it.
  BENCH_PARTS_PASSWORD_HASH: "scrypt$16384$8$1$CHANGE-ME"
  # Signs the session cookie. If unset it's derived from the password hash,
  # which works, but then changing the password logs everyone out.
  BENCH_PARTS_SESSION_SECRET: "CHANGE-ME"
  # The bearer token for benchhud's Inventory tab and scripts. `bench-parts new-token`.
  BENCH_PARTS_API_TOKEN: "CHANGE-ME"
